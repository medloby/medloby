name: Medloby CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17.12@sha256:223efeb196329b55b3b9a13db144956411dbc18e727e59f681c3e0aede6475cf
        env:
          POSTGRES_DB: medloby_test
          POSTGRES_USER: medloby_test
          POSTGRES_PASSWORD: medloby_test
          POSTGRES_INITDB_ARGS: --locale=C.UTF-8
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U medloby_test -d medloby_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Audit locked dependencies
        run: |
          composer audit --locked --no-interaction
          npm audit

      - name: Build frontend assets
        run: npm run build

      - name: Check source syntax
        run: |
          find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find resources/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Scan Git history and built frontend for secrets
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.24.3_linux_x64.tar.gz"
          curl -fsSL --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o "$archive"
          printf '%s  %s\n' '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c' "$archive" | sha256sum --check --strict
          tar -xf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts='--all --full-history' --redact=100 --no-banner .
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner public/build

      - name: Run the SQLite test suite
        run: php artisan test --compact

      - name: Run frontend session tests
        run: node --test tests/workspace-api.test.js

      - name: Install PostgreSQL 17 client tools
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/medloby-postgresql.asc"
          sudo install -D -m 0644 "$RUNNER_TEMP/medloby-postgresql.asc" /etc/apt/keyrings/medloby-postgresql.asc
          . /etc/os-release
          printf '%s\n' "deb [signed-by=/etc/apt/keyrings/medloby-postgresql.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/medloby-postgresql.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          printf '%s\n' /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Run the PostgreSQL 17 test suite
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          DB_DATABASE: medloby_test
          DB_USERNAME: medloby_test
          DB_PASSWORD: medloby_test
        run: php artisan test --compact
